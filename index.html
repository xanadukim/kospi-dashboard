function App() {
  const [selectedIndustry, setSelectedIndustry] = useState('elec');
  const [activeTab, setActiveTab] = useState('model');
  const [zScores, setZScores] = useState(initialZ);
  const [weeklyPicks, setWeeklyPicks] = useState(baseWeekly);
  const [lastUpdate, setLastUpdate] = useState('07:30 KST');
  const [history, setHistory] = useState([]);
  const [selectedDate, setSelectedDate] = useState('2026-09-26');
  const [loadError, setLoadError] = useState(null);
  const [showHelp, setShowHelp] = useState(false);

  const currentIndustry = useMemo(() => industries.find(i => i.id === selectedIndustry), [selectedIndustry]);

  const contributions = useMemo(() => {
    const entries = Object.entries(currentIndustry.betas);
    return entries.map(([k, beta]) => {
      const z = zScores[k] ?? 0;
      return { factor: k, beta, z, contrib: beta * z };
    }).sort((a,b) => Math.abs(b.contrib) - Math.abs(a.contrib));
  }, [currentIndustry, zScores]);

  const totalPred = useMemo(() => contributions.reduce((s,c) => s + c.contrib, 0), [contributions]);

  // Firebase 실시간 구독 - 에러 처리 포함
  useEffect(()=>{
    if(!db) return;
    const unsub = db.collection('factor_snapshots').orderBy('date','desc').limit(30)
      .onSnapshot(snap=>{
        const arr = snap.docs.map(d=>d.data());
        setHistory(arr);
        setLoadError(null);
        console.log(`Firebase ${arr.length}개 로드됨`);
      }, err=>{
        console.error('Firestore 로드 에러', err);
        setLoadError(`Firestore 로드 실패: ${err.message}. 규칙을 확인하세요: Firestore > 규칙 > allow read, write: if true 로 게시 필요`);
      });
    return ()=>unsub();
  },[]);

  const randomize = () => {
    const newZ = {};
    Object.keys(initialZ).forEach(k => { newZ[k] = +(Math.random()*4 -2).toFixed(2); });
    setZScores(newZ);
    setLastUpdate(new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }) + ' KST');
    setWeeklyPicks(prev => prev.map(p => ({ ...p, score: +(Math.random()*2 + 6.5).toFixed(1), expectedReturn: +(Math.random()*2 + 0.5).toFixed(1) })));
  };

  const saveToFirebase = async () => {
    if(!db) { 
      alert('Firebase 설정이 필요합니다. firebaseConfig를 확인하세요'); 
      return; 
    }
    const today = new Date().toISOString().slice(0,10);
    try {
      await db.collection('factor_snapshots').doc(today).set({ 
        date: today, 
        zScores, 
        rawValues: { SP500: 5780.12, US10Y: 4.72, USD_KRW: 1382.5, WTI: 72.3 },
        weeklyPicks,
        createdAt: firebase.firestore.FieldValue.serverTimestamp() 
      });
      alert(`Firebase에 ${today} 저장 완료! Firestore에서 확인하세요.`);
    } catch(e) {
      alert(`저장 실패: ${e.message}\n\n1. Firestore 규칙 확인: allow read, write: if true\n2. 네트워크 확인\n3. 프로젝트 ID: kospi-quant`);
    }
  };

  const loadHistorical = (date) => {
    setSelectedDate(date);
    const found = history.find(h=>h.date===date);
    if(found && found.zScores) {
      setZScores(found.zScores);
      if(found.weeklyPicks) setWeeklyPicks(found.weeklyPicks);
      setLastUpdate(`${date} Firebase 복원`);
    }
  };

  return (
    <div className="min-h-screen">
      {/* Header - 풀기능 복구 */}
      <header className="sticky top-0 z-20 bg-white border-b border-slate-200">
        <div className="max-w-[1280px] mx-auto px-4 h-[56px] flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-[#0f172a] text-white flex items-center justify-center font-bold text-[12px]">KQ</div>
            <div>
              <div className="text-[13px] font-bold leading-none">KOSPI Quant Terminal</div>
              <div className="text-[10px] font-mono text-slate-500 mt-0.5">Full v2.4 • {isFirebaseReady?'Firebase Live':'Local Mode'} • {lastUpdate}</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setShowHelp(true)} className="h-8 px-3 rounded-lg bg-slate-100 text-[12px] font-semibold">? 도움말</button>
            <button onClick={randomize} className="h-8 px-3 rounded-lg bg-white border border-slate-200 text-[12px] font-semibold">팩터 랜덤</button>
            <button onClick={saveToFirebase} className="h-8 px-3 rounded-lg bg-emerald-600 text-white text-[12px] font-semibold">Firebase 저장</button>
            <span className={`text-[11px] font-mono px-2.5 py-1 rounded-full border ${isFirebaseReady?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-slate-100 border-slate-200 text-slate-500'}`}>● {isFirebaseReady?'Firebase Live':'Local'}</span>
          </div>
        </div>
      </header>

      {loadError && (
        <div className="max-w-[1280px] mx-auto mt-3 px-4">
          <div className="bg-red-50 border border-red-200 text-red-700 rounded-[10px] p-3 text-[12px]">
            <b>⚠️ Firestore 에러:</b> {loadError}
            <div className="mt-2 font-mono text-[11px] bg-white border rounded p-2">
              해결: Firebase Console &gt; Firestore &gt; 규칙 탭 &gt; 아래로 교체 후 [게시]<br/>
              rules_version = '2';<br/>
              service cloud.firestore &#123;<br/>
              &nbsp;&nbsp;match /databases/&#123;database&#125;/documents &#123;<br/>
              &nbsp;&nbsp;&nbsp;&nbsp;match /&#123;document=**&#125; &#123; allow read, write: if true; &#125;<br/>
              &nbsp;&nbsp;&#125;<br/>
              &#125;
            </div>
          </div>
        </div>
      )}

      <div className="max-w-[1280px] mx-auto p-4 grid grid-cols-12 gap-4">
        {/* Sidebar - 풀기능 복구 */}
        <aside className="col-span-12 lg:col-span-3">
          <div className="bg-white rounded-[12px] border border-slate-200 p-3">
            <div className="text-[11px] font-bold tracking-widest text-slate-500 mb-2">INDUSTRIES (R² 높은 순)</div>
            {industries.slice().sort((a,b)=>b.r2-a.r2).map(ind=>(
              <button key={ind.id} onClick={()=>setSelectedIndustry(ind.id)} className={`w-full text-left flex justify-between items-center rounded-[10px] px-3 py-2.5 mb-1.5 border transition ${selectedIndustry===ind.id?'bg-slate-900 text-white border-slate-900':'bg-white border-slate-200 hover:border-slate-300'}`}>
                <span className="text-[12px] font-semibold">{ind.icon} {ind.short}</span>
                <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/20 border">R² {ind.r2}</span>
              </button>
            ))}
          </div>
          
          <div className="mt-3 bg-white rounded-[12px] border border-slate-200 p-3">
            <div className="text-[11px] font-bold">타임머신 - 과거 팩터 복원</div>
            <div className="mt-2 flex gap-1 overflow-x-auto pb-2">
              {['2026-09-26','2026-09-25','2026-09-24','2026-08-15','2026-03-12'].map(d=>{
                const exists = history.find(h=>h.date===d);
                return (
                  <button key={d} onClick={()=>loadHistorical(d)} className={`shrink-0 px-2.5 py-1 rounded-full text-[10px] font-mono border ${selectedDate===d?'bg-[#0f172a] text-white border-[#0f172a]': exists?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-white border-slate-200'}`}>{d} {exists?'✓':''}</button>
                )
              })}
            </div>
            <div className="text-[10px] text-slate-500 mt-1">선택: {selectedDate} {history.find(h=>h.date===selectedDate)?'✓ Firebase에서 불러옴':'- 로컬 데이터'}</div>
            {history.length>0 && <div className="mt-2 text-[10px] font-mono bg-slate-50 border rounded p-2">Firebase 저장 {history.length}개 로드됨</div>}
          </div>

          <div className="mt-3 bg-white rounded-[12px] border border-slate-200 p-3">
            <div className="text-[11px] font-bold mb-2">zScores (number → double)</div>
            {Object.entries(zScores).map(([k,v])=>(
              <div key={k} className="flex items-center gap-2 py-1">
                <div className="w-[88px] text-[11px] font-semibold">{factorMeta[k]?.label || k}</div>
                <input type="number" step="0.01" value={v} onChange={e=>setZScores({...zScores, [k]: parseFloat(e.target.value)||0})} className="flex-1 h-7 px-2 rounded border border-slate-200 text-[11px] font-mono" />
                <div className="text-[10px] text-slate-400">σ</div>
              </div>
            ))}
            <div className="mt-2 text-[10px] text-slate-500">소수는 <b>double</b> 유형으로 저장 (Firestore에서 number 선택 시 double)</div>
          </div>
        </aside>

        {/* Main - 탭 3개 풀기능 복구 */}
        <main className="col-span-12 lg:col-span-9">
          {/* Tab Navigation - 첨부파일 기능 복구 */}
          <div className="bg-white rounded-[12px] border border-slate-200 p-2 flex gap-1">
            {[
              { id: 'model', label: '산업 회귀모델', sub: 'Today' },
              { id: 'picks', label: '월요일 추천', sub: 'Monday Picks' },
              { id: 'track', label: '성과 추적', sub: 'Track Record' }
            ].map(tab=>(
              <button key={tab.id} onClick={()=>setActiveTab(tab.id)} className={`flex-1 h-10 rounded-[8px] text-[12px] font-semibold flex flex-col items-center justify-center ${activeTab===tab.id?'bg-[#0f172a] text-white':'text-slate-500 hover:bg-slate-50'}`}>
                <span>{tab.label}</span>
                <span className="text-[9px] font-mono opacity-60">{tab.sub}</span>
              </button>
            ))}
          </div>

          {activeTab==='model' && (
            <div className="mt-3 bg-white rounded-[12px] border border-slate-200 p-4">
              <div className="flex justify-between items-start">
                <div>
                  <h2 className="text-[16px] font-bold">{currentIndustry.name} <span className="font-mono text-[11px] bg-slate-100 px-2 py-0.5 rounded ml-2">R² {currentIndustry.r2}</span></h2>
                  <p className="text-[12px] text-slate-500 mt-1">{currentIndustry.description} • R² {currentIndustry.r2} - {currentIndustry.betas ? Object.keys(currentIndustry.betas).length+'개 팩터' : ''}</p>
                </div>
                <div className="text-right">
                  <div className="text-[11px] text-slate-500">오늘 산업 예측</div>
                  <div className={`text-[20px] font-mono font-bold ${totalPred>=0?'text-emerald-600':'text-red-600'}`}>{totalPred>=0?'+':''}{totalPred.toFixed(3)}σ</div>
                  <div className="text-[11px] font-mono text-slate-500">≈ {(totalPred*1.2).toFixed(2)}%</div>
                </div>
              </div>

              <div className="mt-4 grid grid-cols-12 gap-3">
                <div className="col-span-12 md:col-span-7">
                  <div className="text-[11px] font-bold tracking-widest text-slate-500 mb-2">FACTOR BETA × Z-SCORE = CONTRIBUTION</div>
                  {contributions.map(c => (
                    <div key={c.factor} className="flex items-center gap-2 py-2 border-b border-slate-100 last:border-0">
                      <div className="w-[88px] text-[11px] font-semibold">{factorMeta[c.factor]?.label || c.factor}</div>
                      <div className="w-[44px] text-[10px] font-mono text-slate-500">β {c.beta.toFixed(2)}</div>
                      <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div className={`h-2 rounded-full bar-animate ${c.contrib>=0?'bg-emerald-500':'bg-red-500'}`} style={{ width: `${Math.min(100, Math.abs(c.contrib)*50)}%` }} />
                      </div>
                      <div className={`w-[72px] text-right text-[11px] font-mono font-bold ${c.contrib>=0?'text-emerald-600':'text-red-600'}`}>{c.contrib>=0?'+':''}{c.contrib.toFixed(3)}σ</div>
                    </div>
                  ))}
                </div>
                <div className="col-span-12 md:col-span-5">
                  <div className="rounded-[10px] bg-slate-50 border border-slate-200 p-3">
                    <div className="text-[11px] font-bold">회귀식</div>
                    <div className="font-mono text-[10px] leading-relaxed mt-2 text-slate-700 break-all">
                      {currentIndustry.name} = {Object.entries(currentIndustry.betas).map(([k,b])=> `${b>0?'+':''}${b.toFixed(2)}*${k}`).join(' ')} + ε
                    </div>
                    <div className="mt-3 text-[11px] text-slate-500">해석: 이 산업은 <b className="text-slate-900">{contributions[0]?.factor}</b>에 가장 민감합니다. {factorMeta[contributions[0]?.factor]?.desc}</div>
                  </div>
                  <div className="mt-3 rounded-[10px] bg-[#0f172a] text-white p-3">
                    <div className="text-[11px] font-bold">Firebase 연동 상태</div>
                    <div className="mt-1 text-[10px] text-slate-300 leading-relaxed">
                      저장된 스냅샷: {history.length}개
                      </div><div>현재 선택: {selectedDate}
                      </div><div>RawValues: SP500 5780, US10Y 4.72% 등 double 저장
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeTab==='picks' && (
            <div className="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
              {weeklyPicks.map(p => {
                const ind = industries.find(i=>i.id===p.industryId);
                return (
                  <div key={p.ticker} className="bg-white rounded-[12px] border border-slate-200 p-3 card-hover">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="text-[12px]">{ind?.icon}</span>
                        <span className="text-[11px] font-bold">{ind?.short}</span>
                        <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-100">{p.ticker}</span>
                      </div>
                      <span className="text-[11px] font-mono font-bold px-2 py-1 rounded bg-[#0f172a] text-white">Score {p.score}</span>
                    </div>
                    <div className="mt-2 text-[14px] font-bold">{p.name}</div>
                    <div className="text-[11px] text-slate-500 mt-1">{p.reason}</div>
                    <div className="mt-2 flex items-center gap-2 text-[11px] font-mono">
                      <span className="px-2 py-1 rounded bg-emerald-50 border border-emerald-200 text-emerald-700">예상 +{p.expectedReturn}%</span>
                      <span className="text-slate-400">Target: {p.targetFactor}</span>
                    </div>
                  </div>
                )
              })}
            </div>
          )}

          {activeTab==='track' && (
            <div className="mt-3 bg-white rounded-[12px] border border-slate-200 overflow-hidden">
              <div className="p-3 flex items-center justify-between border-b">
                <h3 className="text-[13px] font-bold">지난주 추천 성과 (09-15 → 09-22)</h3>
                <span className="text-[11px] font-mono px-2 py-1 rounded bg-emerald-50 border border-emerald-200">평균 +1.84% • KOSPI 대비 +1.21%p • Hit 5/8</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-[11px]">
                  <thead className="bg-slate-50 text-slate-500 font-mono text-[10px]">
                    <tr><th className="text-left px-3 py-2">산업</th><th className="text-left px-3 py-2">종목</th><th className="text-right px-3 py-2">추천가</th><th className="text-right px-3 py-2">현재가</th><th className="text-right px-3 py-2">수익률</th><th className="text-right px-3 py-2">vs KOSPI</th><th className="text-left px-3 py-2">상태</th></tr>
                  </thead>
                  <tbody>
                    {pastPicks.map(r => (
                      <tr key={r.ticker} className="border-t border-slate-100">
                        <td className="px-3 py-2.5">{r.industry}</td>
                        <td className="px-3 py-2.5 font-semibold">{r.name} <span className="font-mono text-[10px] text-slate-400 ml-1">{r.ticker}</span></td>
                        <td className="px-3 py-2.5 text-right font-mono">{r.buyPrice.toLocaleString()}</td>
                        <td className="px-3 py-2.5 text-right font-mono">{r.currentPrice.toLocaleString()}</td>
                        <td className={`px-3 py-2.5 text-right font-mono font-bold ${r.returnPct>=0?'text-emerald-600':'text-red-600'}`}>{r.returnPct>0?'+':''}{r.returnPct}%</td>
                        <td className={`px-3 py-2.5 text-right font-mono ${r.vsKospi>=0?'text-emerald-600':'text-red-600'}`}>{r.vsKospi>0?'+':''}{r.vsKospi}%p</td>
                        <td className="px-3 py-2.5"><span className={`px-1.5 py-0.5 rounded text-[10px] ${r.status==='성공'?'bg-emerald-50 text-emerald-700 border border-emerald-200': r.status==='실패'?'bg-red-50 text-red-700 border border-red-200':'bg-slate-100 text-slate-600 border'}`}>{r.status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div className="mt-4 bg-[#0f172a] text-white rounded-[12px] p-4">
            <div className="text-[12px] font-bold">에러 처리 완료 내역</div>
            <div className="mt-2 text-[11px] leading-relaxed text-slate-300 grid grid-cols-1 md:grid-cols-3 gap-3">
              <div><b className="text-white">✅ 404 app.js</b><div>외부 JSX 파일 src로 로드 시 발생 → 인라인 script type=text/babel 로 해결</div></div>
              <div><b className="text-white">✅ Firestore 로드 실패</b><div>규칙이 if false 이면 발생 → if true 로 게시 후 해결, onSnapshot 에러 핸들러 추가</div></div>
              <div><b className="text-white">✅ zScores double</b><div>number 0.85 저장 시 int64 → double 선택, parseFloat 처리</div></div>
            </div>
          </div>
        </main>
      </div>

      <HelpModal open={showHelp} onClose={()=>setShowHelp(false)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
