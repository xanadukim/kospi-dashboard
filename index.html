      });
      setSelectedDate(doc.date);
      setIsViewingHistory(doc.date !== (history[0]?.date));

  const returnToLatest = () => { if(history[0]){ loadSnapshot(history[0].date); setIsViewingHistory(false);} };

  useEffect(()=>{
    if(!db) return;

      const docs = snap.docs.map(d=>d.data());

    return ()=>unsub();

  const currentIndustry = useMemo(()=> industries.find(i=>i.id===selectedIndustry) || industries[0], [selectedIndustry]);

  const contributions = useMemo(()=>{
    return Object.entries(currentIndustry.betas).map(([factor, beta])=>{
      const z = zScores[factor] ?? zScores[factorMeta[factor]?.label] ?? 0;
      const contrib = beta * z;
      return { factor, beta, z, contrib };
    }).sort((a,b)=> Math.abs(b.contrib) - Math.abs(a.contrib));
  }, [currentIndustry, zScores]);

  const predictedReturn = useMemo(()=> contributions.reduce((sum,c)=> sum + c.contrib, 0), [contributions]);

                            <div className="text-xs font-mono font-bold" style={{color: ind.betaM>1?'#dc2626':ind.betaM>0.9?'#2563eb':'#059669'}}>β_m {ind.betaM.toFixed(2)}</div>
                            <div className="text-xs font-mono text-slate-500">{ind.betaM>1?'고베타':'저베타'}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="mt-3 p-2.5 rounded-lg bg-blue-50 border border-blue-200 text-xs text-blue-800">
                      💡 β_market {">"}1: KOSPI보다 변동성 큼 (전기전자, 건설) • β_market {"<"}0.8: 방어적 (금융, 바이오)
                    </div>
                  </div>

                  <div className="rounded-2xl p-4 text-white shadow-lg" style={{background: 'linear-gradient(135deg, #059669 0%, #10b981 100%)'}}>
                    <div className="text-xs font-bold tracking-widest">마켓 중립 알파 전략</div>
                    <div className="mt-2 text-xs leading-relaxed">
                      <div className="font-mono text-xs">Long: 건설·조선 α +0.31% (β_m 1.05)</div>
                      <div className="font-mono text-xs">Short: 화학·전지 α -0.12% (β_m 0.88)</div>
                      <div className="mt-2 pt-2 border-t border-white/20 text-xs opacity-90">
                        KOSPI 헤지 후 순수 알파 +0.43% 기대<br/>
                        = (0.31 - (-0.12)) + (1.05-0.88)·R_KOSPI 헤지
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* KOSPI Prediction vs Actual */}
              <div className="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm">
                <div className="flex items-center justify-between">
                  <h4 className="text-sm font-extrabold tracking-tight">KOSPI 예측 vs 실제 (최근 12주) • 2-Stage 모델 검증</h4>
                  <span className="text-xs font-mono px-2 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700">평균 오차 0.38%p • 방향 적중 75%</span>
                </div>
                <div className="mt-4 grid grid-cols-12 gap-1 h-36 items-end">
                  {[
                    { pred:0.8, actual:1.2, date:'W1' },
                    { pred:1.2, actual:0.9, date:'W2' },
                    { pred:-0.5, actual:-0.8, date:'W3' },
                    { pred:0.6, actual:0.5, date:'W4' },
                    { pred:1.5, actual:1.8, date:'W5' },
                    { pred:0.3, actual:0.1, date:'W6' },
                    { pred:1.1, actual:1.4, date:'W7' },
                    { pred:0.4, actual:0.3, date:'W8' },
                    { pred:1.3, actual:1.1, date:'W9' },
                    { pred:-0.2, actual:-0.4, date:'W10' },
                    { pred:0.9, actual:1.0, date:'W11' },
                    { pred:0.84, actual:1.2, date:'W12' },
                  ].map((w,i)=>(
                    <div key={i} className="col-span-1 flex flex-col items-center gap-1 h-full justify-end">
                      <div className="flex flex-col items-center gap-1 w-full">
                        <div className="w-full rounded-t-sm" style={{height: `${Math.abs(w.actual)*18}px`, background: w.actual>=0?'#0f172a':'#ef4444'}} title={`실제 ${w.actual}%`} />
                        <div className="w-full rounded-sm border-2 border-dashed" style={{height: `${Math.abs(w.pred)*18}px`, borderColor: w.pred>=0?'#3b82f6':'#f87171', background: w.pred>=0?'#dbeafe':'#fee2e2'}} title={`예측 ${w.pred}%`} />
                      </div>
                      <span className="text-xs font-mono text-slate-400">{w.date}</span>
                    </div>
                  ))}
                </div>
                <div className="mt-3 flex items-center justify-center gap-4 text-xs font-mono">
                  <span className="flex items-center gap-1.5"><span className="w-3 h-2 rounded-sm bg-slate-900"></span>실제 KOSPI</span>
                  <span className="flex items-center gap-1.5"><span className="w-3 h-2 rounded-sm border-2 border-dashed border-blue-400 bg-blue-100"></span>예측</span>
                  <span className="text-slate-500">오차 {"<"}0.5%p이면 우수</span>
                </div>
              </div>

              {/* Overall KOSPI Model Formula */}
              <div className="rounded-2xl border-2 border-slate-900 bg-slate-900 p-4 text-white">
                <div className="text-xs font-bold tracking-widest text-slate-400">OVERALL KOSPI MODEL v4.0 • FINAL FORMULA</div>
                <div className="mt-3 font-mono text-xs leading-relaxed break-all">
                  <span className="text-slate-500">Stage 1:</span> R_KOSPI = 0.12% + 0.38·S&P500 + 0.32·외국인 + 0.28·SOX + 0.15·원달러 + 0.22·중국PMI -0.18·US10Y + 0.18·스프레드 -0.08·WTI + 0.12·정책 + ε_m (R²=0.92)<br/>
                  <span className="text-slate-500 mt-2 block">Stage 2:</span> R_전기전자 = 1.12·R_KOSPI + 0.18% + 0.35·SOX_res + 0.28·외국인_res + ε<br/>
                  R_자동차 = 0.92·R_KOSPI + 0.08% + 0.25·원달러_res + ...<br/>
                  <span className="text-emerald-300 mt-2 block">→ 전체 KOSPI 모델로 마켓 리스크 헤지 후 산업별 순수 알파 추출 가능</span>
                </div>
                <div className="mt-3 grid grid-cols-3 gap-2 text-xs">
                  <div className="rounded bg-white/5 border border-white/10 p-2"><div className="text-slate-400">Method</div><div className="font-bold mt-0.5">2-Stage Ridge + Lasso</div></div>
                  <div className="rounded bg-white/5 border border-white/10 p-2"><div className="text-slate-400">VIF max</div><div className="font-bold mt-0.5 text-emerald-300">1.8 • 안정</div></div>
                  <div className="rounded bg-white/5 border border-white/10 p-2"><div className="text-slate-400">Samples</div><div className="font-bold mt-0.5">180D • 6개월</div></div>
                </div>
              </div>
            </div>
          )}
        </main>



        <aside className="col-span-12 md:col-span-4 space-y-4">
          <div className="rounded-2xl border bg-white p-4 shadow-sm" style={{borderColor: '#e2e8f0'}}>
            <div className="flex items-center justify-between"><h3 className="text-sm font-extrabold tracking-tight">Today's Factor Z-Scores</h3><span className="text-xs font-mono px-2.5 py-1 rounded-full bg-slate-900 text-white font-bold">Live • Modern</span></div>
            <div className="mt-4">
              <div className="grid grid-cols-12 text-xs font-mono text-slate-400 pb-2 border-b font-bold tracking-widest"><div className="col-span-6">FACTOR</div><div className="col-span-2 text-right">Z</div><div className="col-span-2 text-right">β</div><div className="col-span-2 text-right">기여도</div></div>
              {contributions.map(c=>{
                const zAbs = Math.abs(c.z);
                const zCls = zAbs>1 ? (c.z>0?'z-strong-pos':'z-strong-neg') : (c.z>0?'z-pos':c.z<0?'z-neg':'z-neutral');
                return (
                  <div key={c.factor} className="grid grid-cols-12 py-3 border-b border-slate-50 items-center hover:bg-slate-50/50 rounded-lg px-1 transition-colors">
                    <div className="col-span-6"><div className="text-sm font-bold tracking-tight">{c.factor}</div><div className="text-xs text-slate-500">{factorMeta[c.factor]?.desc || ''}</div></div>
                    <div className="col-span-2 text-right"><span className={`z-badge ${zCls}`}>{c.z>0?'+':''}{c.z.toFixed(2)}</span></div>
                    <div className="col-span-2 text-right font-mono text-xs font-semibold text-slate-600">{c.beta>0?'+':''}{c.beta.toFixed(2)}</div>
                    <div className={`col-span-2 text-right font-mono text-xs font-bold ${c.contrib>=0?'text-emerald-600':'text-red-600'}`}>{c.contrib>0?'+':''}{c.contrib.toFixed(2)}%</div>
                  </div>
                )
              })}
            </div>
            <div className="mt-4 rounded-xl p-3.5 flex items-center justify-between text-white shadow-lg" style={{background: `linear-gradient(135deg, ${currentIndustry.color} 0%, ${currentIndustry.color}cc 100%)`, boxShadow: `0 8px 20px ${currentIndustry.color}30`}}>
              <span className="text-sm font-bold">예측 수익률 합계 • {currentIndustry.short}</span>
              <span className="font-mono text-xs font-extrabold bg-white text-slate-900 px-3 py-1 rounded-full shadow-sm">{predictedReturn>0?'+':''}{predictedReturn.toFixed(2)}%</span>
            </div>
            <div className="mt-4 grid grid-cols-2 gap-3 text-xs">
              <div className="rounded-xl p-3 border" style={{background: 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)', borderColor: '#a7f3d0'}}><div className="text-xs font-mono text-emerald-700 font-bold">다중공선성 VIF</div><div className="mt-1 font-mono font-bold text-emerald-900">max 2.4 <span className="text-emerald-700">• 안정</span></div></div>
              <div className="rounded-xl p-3 border" style={{background: 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)', borderColor: '#e2e8f0'}}><div className="text-xs font-mono text-slate-500 font-bold">잔차 왜도 / 첨도</div><div className="mt-1 font-mono font-bold">0.12 / 3.1 <span className="text-slate-500">정규근사</span></div></div>
            </div>
          </div>

          <div className="rounded-2xl p-5 text-white shadow-xl" style={{background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)', border: '1px solid rgba(255,255,255,0.08)'}}>
            <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div><div className="text-xs font-bold tracking-widest">DATA PIPELINE • PRODUCTION • Modern</div></div>
            <div className="mt-4 space-y-2.5 text-xs font-mono">
              <div className="flex flex-wrap items-center gap-2"><span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/10 backdrop-blur">yfinance</span><span className="text-slate-500">+</span><span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/10">KRX API</span><span className="text-slate-500">+</span><span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/10">FRED</span><span className="text-slate-500">→</span><span className="px-2.5 py-1 rounded-full" style={{background: 'linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%)', color: 'white'}}>Python</span></div>
              <div className="flex flex-wrap items-center gap-2"><span>→ StandardScaler → RidgeCV(λ) →</span><span className="px-2.5 py-1 rounded-full" style={{background: 'linear-gradient(135deg, #10b981 0%, #34d399 100%)', color: 'white'}}>Dashboard</span><span className="text-slate-500">• CRON 일요일 18:00</span></div>
              <div className="mt-3 pt-3 border-t border-white/10 text-xs text-slate-400 leading-relaxed">Features: 9 factors, 120D rolling, Missing→ffill, Outlier 3σ Winsorize<br/>Output: β matrix (8x9), Z-scores, Score = β·Z + Alpha • Quant Terminal v46<br/>Firebase Live: {liveCount}개 스냅샷 • {selectedDate} • onSnapshot</div>
              <div className="mt-3 grid grid-cols-3 gap-2 text-xs">
                <div className="rounded-lg bg-white/5 border border-white/10 p-2.5 backdrop-blur"><div className="text-slate-400">Last Update</div><div className="font-bold mt-0.5 text-white">{selectedDate} 18:00</div></div>
                <div className="rounded-lg bg-white/5 border border-white/10 p-2.5"><div className="text-slate-400">Latency</div><div className="font-bold mt-0.5 text-white">~4.2 min</div></div>
                <div className="rounded-lg bg-white/5 border border-white/10 p-2.5"><div className="text-slate-400">Status</div><div className="font-bold mt-0.5 text-emerald-300">● Live</div></div>
              </div>
            </div>
          </div>

          <div className="text-center text-xs font-mono text-slate-500 py-2">KOSPI Quant Terminal v46 • 2-Stage 8×8 Industry • 6개월 재학습 • © 2026 Quant Lab</div>
        </aside>
      </div>

      <HistoryModal open={showHistory} onClose={()=>setShowHistory(false)} history={history} selectedDate={selectedDate} onSelect={loadSnapshot} />
      <HelpModal open={showHelp} onClose={()=>setShowHelp(false)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
