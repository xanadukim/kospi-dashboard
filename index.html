/* Picks card modern */
.pick-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; position: relative; transition: all 0.35s; }

    const day = d.getDay();
    return `${daysEn[day]} (${daysKr[day]})`;
  } catch { return ''; }
};

function App(){
  const [selectedIndustry, setSelectedIndustry] = useState('elec');
  const [zScores, setZScores] = useState({ 'S&P500': 0.63, '외국인 선물': 1.07, 'SOX / 필라': 1.59, 'US 10Y': -1.13, '중국 PMI': 0.21, '원달러': 1.38, 'WTI': -0.32, '한미스프레드': 0.91 });
  const [history, setHistory] = useState([]);
  const [selectedDate, setSelectedDate] = useState('2026-09-26');
  const [showHelp, setShowHelp] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [activeTab, setActiveTab] = useState('model');
  const [liveCount, setLiveCount] = useState(0);
  const [lastRefresh, setLastRefresh] = useState(new Date());
  const [isViewingHistory, setIsViewingHistory] = useState(false);

  const loadSnapshot = (dateStr) => {
    const doc = history.find(d=>d.date===dateStr);
    if(!doc) return;
    const cloud = doc.zScores;
    if(cloud){
      setZScores({
        'S&P500': cloud.SP500 ?? cloud['S&P500'] ?? 0.63,
        '외국인 선물': cloud.외국인 ?? cloud.외국인_선물 ?? 1.07,
        'SOX / 필라': cloud.반도체팩터 ?? cloud['SOX / 필라'] ?? 1.59,
        'US 10Y': cloud.US10Y ?? -1.13,
        '중국 PMI': cloud.중국PMI ?? 0.21,
        '원달러': cloud.원달러 ?? 1.38,
        'WTI': cloud.WTI ?? -0.32,
        '한미스프레드': cloud.한미스프레드 ?? 0.91,
      });
      setSelectedDate(doc.date);
      setIsViewingHistory(doc.date !== (history[0]?.date));
      setLastRefresh(new Date());
    }
  };
  const returnToLatest = () => { if(history[0]){ loadSnapshot(history[0].date); setIsViewingHistory(false);} };

  useEffect(()=>{
    if(!db) return;
    const unsub = db.collection('factor_snapshots').orderBy('date','desc').limit(10).onSnapshot(snap=>{
      const docs = snap.docs.map(d=>d.data());
      setHistory(docs);
      setLiveCount(docs.length);
      setLastRefresh(new Date());
      if(docs[0]?.zScores && !isViewingHistory){
        const cloud = docs[0].zScores;
        setZScores({
          'S&P500': cloud.SP500 ?? cloud['S&P500'] ?? 0.63,
          '외국인 선물': cloud.외국인 ?? cloud.외국인_선물 ?? 1.07,
          'SOX / 필라': cloud.반도체팩터 ?? cloud['SOX / 필라'] ?? 1.59,
          'US 10Y': cloud.US10Y ?? -1.13,
          '중국 PMI': cloud.중국PMI ?? 0.21,
          '원달러': cloud.원달러 ?? 1.38,
          'WTI': cloud.WTI ?? -0.32,
          '한미스프레드': cloud.한미스프레드 ?? 0.91,
        });
        setSelectedDate(docs[0].date);
      }
    });
    return ()=>unsub();
  },[isViewingHistory]);

  const currentIndustry = useMemo(()=> industries.find(i=>i.id===selectedIndustry) || industries[0], [selectedIndustry]);

  const contributions = useMemo(()=>{
    return Object.entries(currentIndustry.betas).map(([factor, beta])=>{
      const z = zScores[factor] ?? zScores[factorMeta[factor]?.label] ?? 0;
      const contrib = beta * z;
      return { factor, beta, z, contrib };
    }).sort((a,b)=> Math.abs(b.contrib) - Math.abs(a.contrib));
  }, [currentIndustry, zScores]);

  const predictedReturn = useMemo(()=> contributions.reduce((sum,c)=> sum + c.contrib, 0), [contributions]);

  const weeklyPicks = useMemo(()=>{
    const selected = history.find(d=>d.date===selectedDate) || history[0];
    const getZ = (tf) => {
      const map = {
        '반도체팩터': zScores['SOX / 필라'] ?? 1.59,
        '원달러': zScores['원달러'] ?? 1.38,
        '중국PMI': zScores['중국 PMI'] ?? 0.21,
        '한미스프레드': zScores['한미스프레드'] ?? 0.91,
        'US10Y': zScores['US 10Y'] ?? -1.13,
        'SP500': zScores['S&P500'] ?? 0.63,
      };
      return map[tf] ?? 0.8;
    };
    if(selected?.weeklyPicks && selected.weeklyPicks.length >= 20){ return selected.weeklyPicks; }
    const mockData = [

              <div className="rounded-[18px] p-4 text-white" style={{background: `linear-gradient(135deg, ${currentIndustry.color} 0%, ${currentIndustry.color}dd 100%)`, boxShadow: `0 8px 24px ${currentIndustry.color}30`}}>
                <div className="flex items-center justify-between"><h3 className="text-[13px] font-extrabold tracking-tight">월요일 추천 - {currentIndustry.name} 8종목 <span className="text-[10px] font-mono ml-2 opacity-80 bg-white/20 px-2 py-1 rounded-full">전체 64종 중 {currentIndustry.short} Top 8 • KRX β·모멘텀</span></h3><span className="text-[11px] font-mono bg-white/20 backdrop-blur px-2.5 py-1 rounded-full">{selectedDate} 18:00 KST • 일요일</span></div>
                <div className="mt-1.5 text-[11px] text-white/85">Score = 6.5 + |Z|×1.2×β_adj + mom×0.3 • 타겟팩터 {Object.entries(currentIndustry.betas).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0]?.[0]}</div>
              </div>
              <div className="mt-3.5 grid grid-cols-1 md:grid-cols-2 gap-3.5">
                {weeklyPicks.filter(p=>p.industryId===selectedIndustry).slice(0,8).map(p=>{
                  const ind = industries.find(i=>i.id===p.industryId);
                  return (
                    <div key={`${p.industryId}-${p.ticker}`} className={`pick-card ${p.industryId} card-hover`}>
                      <div className="p-4">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2"><span className="w-8 h-8 rounded-[8px] flex items-center justify-center text-[13px] font-bold" style={{background: `${ind.color}15`, color: ind.color}}>{ind?.icon}</span><span className="text-[11px] font-bold px-2 py-1 rounded-full" style={{background: `${ind.color}10`, color: ind.color}}>{ind?.short}</span><span className="text-[10px] font-mono px-2 py-1 rounded-full bg-slate-100 border text-slate-600">{p.ticker}</span></div>
                          <span className="text-[11px] font-mono font-bold px-2.5 py-1 rounded-full text-white shadow-md" style={{background: `linear-gradient(135deg, ${ind.color} 0%, ${ind.color}cc 100%)`}}>Score {p.score}</span>
                        </div>
                        <div className="mt-3 text-[15px] font-extrabold tracking-tight">{p.name}</div>
                        <div className="text-[11px] text-slate-500 mt-1 font-mono">{p.reason}</div>
                        <div className="mt-3 flex items-center gap-2"><span className="px-2.5 py-1 rounded-full text-[11px] font-bold font-mono" style={{background: 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)', color: '#065f46', border: '1px solid #a7f3d0'}}>예상 +{p.expectedReturn}%</span><span className="text-[10px] font-mono text-slate-400">Target: {p.targetFactor}</span></div>
                      </div>
                    </div>
                  )
                })}
              </div>
            </div>
          )}

          {activeTab==='track' && (
            <div className="mt-4 rounded-[18px] border bg-white overflow-hidden shadow-sm" style={{borderColor: '#e2e8f0'}}>
              <div className="p-4 flex items-center justify-between" style={{background: `linear-gradient(135deg, ${currentIndustry.color}08 0%, white 100%)`, borderBottom: `1px solid ${currentIndustry.color}15`}}>
                <div><h3 className="text-[13px] font-extrabold tracking-tight">지난주 추천 성과 - {currentIndustry.name} 8종목 <span className="text-[10px] font-mono text-slate-400 ml-2">(09-15 → 09-22)</span></h3><div className="text-[10px] font-mono text-slate-500 mt-0.5">{currentIndustry.short} Top 8 • Firebase 기반 시뮬레이션</div></div>
                <span className="text-[11px] font-mono px-3 py-1.5 rounded-full font-bold" style={{background: 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)', border: '1px solid #a7f3d0', color: '#065f46'}}>평균 {pastPicksAvg.avg>0?'+':''}{pastPicksAvg.avg}% • vs {pastPicksAvg.vsKospi>0?'+':''}{pastPicksAvg.vsKospi}%p • Hit {pastPicksAvg.hit}/{pastPicks.length}</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-[11px]">
                  <thead className="bg-slate-50 text-slate-500 font-mono text-[10px]"><tr><th className="text-left px-3 py-2.5 font-bold">산업</th><th className="text-left px-3 py-2.5 font-bold">종목</th><th className="text-right px-3 py-2.5">추천가</th><th className="text-right px-3 py-2.5">현재가</th><th className="text-right px-3 py-2.5">수익률</th><th className="text-right px-3 py-2.5">vs KOSPI</th><th className="text-left px-3 py-2.5">상태</th></tr></thead>
                  <tbody>
                    {pastPicks.map(r=>(
                      <tr key={r.ticker} className="border-t border-slate-100 hover:bg-slate-50/70 transition-colors">
                        <td className="px-3 py-3"><span className="px-2 py-1 rounded-full text-[10px] font-bold" style={{background: `${currentIndustry.color}12`, color: currentIndustry.color}}>{r.industry}</span></td>
                        <td className="px-3 py-3 font-bold">{r.name} <span className="font-mono text-[10px] text-slate-400 ml-1">{r.ticker}</span></td>
                        <td className="px-3 py-3 text-right font-mono">{r.buyPrice.toLocaleString()}</td>
                        <td className="px-3 py-3 text-right font-mono font-semibold">{r.currentPrice.toLocaleString()}</td>
                        <td className={`px-3 py-3 text-right font-mono font-bold ${r.returnPct>=0?'text-emerald-600':'text-red-600'}`}>{r.returnPct>0?'+':''}{r.returnPct}%</td>
                        <td className={`px-3 py-3 text-right font-mono ${r.vsKospi>=0?'text-emerald-600':'text-red-600'}`}>{r.vsKospi>0?'+':''}{r.vsKospi}%p</td>
                        <td className="px-3 py-3"><span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${r.status==='성공'?'bg-emerald-50 text-emerald-700 border border-emerald-200':r.status==='보류'?'bg-amber-50 text-amber-700 border border-amber-200':'bg-red-50 text-red-700 border border-red-200'}`}>{r.status}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </main>

        <aside className="col-span-12 md:col-span-4 space-y-4">
          <div className="rounded-[18px] border bg-white p-4 shadow-sm" style={{borderColor: '#e2e8f0'}}>
            <div className="flex items-center justify-between"><h3 className="text-[13px] font-extrabold tracking-tight">Today's Factor Z-Scores</h3><span className="text-[10px] font-mono px-2.5 py-1 rounded-full bg-slate-900 text-white font-bold">Live • Modern</span></div>
            <div className="mt-4">
              <div className="grid grid-cols-12 text-[10px] font-mono text-slate-400 pb-2 border-b font-bold tracking-widest"><div className="col-span-6">FACTOR</div><div className="col-span-2 text-right">Z</div><div className="col-span-2 text-right">β</div><div className="col-span-2 text-right">기여도</div></div>
              {contributions.map(c=>{
                const zAbs = Math.abs(c.z);
                const zCls = zAbs>1 ? (c.z>0?'z-strong-pos':'z-strong-neg') : (c.z>0?'z-pos':c.z<0?'z-neg':'z-neutral');
                return (
                  <div key={c.factor} className="grid grid-cols-12 py-3 border-b border-slate-50 items-center hover:bg-slate-50/50 rounded-[8px] px-1 transition-colors">
                    <div className="col-span-6"><div className="text-[13px] font-bold tracking-tight">{c.factor}</div><div className="text-[11px] text-slate-500">{factorMeta[c.factor]?.desc || ''}</div></div>
                    <div className="col-span-2 text-right"><span className={`z-badge ${zCls}`}>{c.z>0?'+':''}{c.z.toFixed(2)}</span></div>
                    <div className="col-span-2 text-right font-mono text-[11px] font-semibold text-slate-600">{c.beta>0?'+':''}{c.beta.toFixed(2)}</div>
                    <div className={`col-span-2 text-right font-mono text-[11px] font-bold ${c.contrib>=0?'text-emerald-600':'text-red-600'}`}>{c.contrib>0?'+':''}{c.contrib.toFixed(2)}%</div>
                  </div>
                )
              })}
            </div>
            <div className="mt-4 rounded-[14px] p-3.5 flex items-center justify-between text-white shadow-lg" style={{background: `linear-gradient(135deg, ${currentIndustry.color} 0%, ${currentIndustry.color}cc 100%)`, boxShadow: `0 8px 20px ${currentIndustry.color}30`}}>
              <span className="text-[13px] font-bold">예측 수익률 합계 • {currentIndustry.short}</span>
              <span className="font-mono text-[16px] font-extrabold bg-white text-slate-900 px-3 py-1 rounded-full shadow-sm">{predictedReturn>0?'+':''}{predictedReturn.toFixed(2)}%</span>
            </div>
            <div className="mt-4 grid grid-cols-2 gap-3 text-[11px]">
              <div className="rounded-[12px] p-3 border" style={{background: 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)', borderColor: '#a7f3d0'}}><div className="text-[10px] font-mono text-emerald-700 font-bold">다중공선성 VIF</div><div className="mt-1 font-mono font-bold text-emerald-900">max 2.4 <span className="text-emerald-700">• 안정</span></div></div>
              <div className="rounded-[12px] p-3 border" style={{background: 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)', borderColor: '#e2e8f0'}}><div className="text-[10px] font-mono text-slate-500 font-bold">잔차 왜도 / 첨도</div><div className="mt-1 font-mono font-bold">0.12 / 3.1 <span className="text-slate-500">정규근사</span></div></div>
            </div>
          </div>

          <div className="rounded-[18px] p-5 text-white shadow-xl" style={{background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)', border: '1px solid rgba(255,255,255,0.08)'}}>
            <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div><div className="text-[12px] font-bold tracking-widest">DATA PIPELINE • PRODUCTION • Modern</div></div>
            <div className="mt-4 space-y-2.5 text-[11px] font-mono">
              <div className="flex flex-wrap items-center gap-2"><span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/10 backdrop-blur">yfinance</span><span className="text-slate-500">+</span><span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/10">KRX API</span><span className="text-slate-500">+</span><span className="px-2.5 py-1 rounded-full bg-white/10 border border-white/10">FRED</span><span className="text-slate-500">→</span><span className="px-2.5 py-1 rounded-full" style={{background: 'linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%)', color: 'white'}}>Python</span></div>
              <div className="flex flex-wrap items-center gap-2"><span>→ StandardScaler → RidgeCV(λ) →</span><span className="px-2.5 py-1 rounded-full" style={{background: 'linear-gradient(135deg, #10b981 0%, #34d399 100%)', color: 'white'}}>Dashboard</span><span className="text-slate-500">• CRON 일요일 18:00</span></div>
              <div className="mt-3 pt-3 border-t border-white/10 text-[10px] text-slate-400 leading-relaxed">Features: 9 factors, 120D rolling, Missing→ffill, Outlier 3σ Winsorize<br/>Output: β matrix (8x9), Z-scores, Score = β·Z + Alpha • Modern UI v3.1<br/>Firebase Live: {liveCount}개 스냅샷 • {selectedDate} • onSnapshot</div>
              <div className="mt-3 grid grid-cols-3 gap-2 text-[10px]">
                <div className="rounded-[10px] bg-white/5 border border-white/10 p-2.5 backdrop-blur"><div className="text-slate-400">Last Update</div><div className="font-bold mt-0.5 text-white">{selectedDate} 18:00</div></div>
                <div className="rounded-[10px] bg-white/5 border border-white/10 p-2.5"><div className="text-slate-400">Latency</div><div className="font-bold mt-0.5 text-white">~4.2 min</div></div>
                <div className="rounded-[10px] bg-white/5 border border-white/10 p-2.5"><div className="text-slate-400">Status</div><div className="font-bold mt-0.5 text-emerald-300">● Live</div></div>
              </div>
            </div>
          </div>

          <div className="text-center text-[10px] font-mono text-slate-500 py-2">KOSPI Quant Terminal v3.1 Modern • 8×8 Industry • © 2026 Quant Lab</div>
        </aside>
      </div>

      <HistoryModal open={showHistory} onClose={()=>setShowHistory(false)} history={history} selectedDate={selectedDate} onSelect={loadSnapshot} />
      <HelpModal open={showHelp} onClose={()=>setShowHelp(false)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
