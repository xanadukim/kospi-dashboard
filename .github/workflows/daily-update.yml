name: Daily KOSPI Auto Update - Cloud Only
on:
  schedule:
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin
      - name: Create service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          echo "SA file size: $(wc -c < /tmp/sa.json) bytes"
          python -m json.tool /tmp/sa.json > /dev/null && echo "JSON valid" || echo "JSON invalid"
      - name: Run daily update
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/daily_update.py
