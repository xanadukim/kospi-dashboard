name: Daily KOSPI Auto Update - Cloud Only
on:
  schedule:
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin
      - name: Validate service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          echo "SA file size: $(wc -c < /tmp/sa.json) bytes"
          python3 << 'PY'
          import json, os
          try:
              with open('/tmp/sa.json') as f:
                  data=json.load(f)
              print(f"Keys found: {list(data.keys())}")
              print(f"Has type field: {'type' in data}")
              print(f"type value: {data.get('type','MISSING')}")
              print(f"Has client_email: {'client_email' in data}")
              print(f"Has private_key: {'private_key' in data}")
              if 'type' not in data:
                  print("ERROR: This is NOT a full service account JSON. You need the whole file with type, project_id, private_key, client_email etc.")
          except Exception as e:
              print(f"JSON parse failed: {e}")
              # Show first 200 chars for debug (no secrets)
              with open('/tmp/sa.json') as f:
                  txt=f.read()
              print(f"First 200 chars: {txt[:200]}")
          PY
      - name: Run daily update
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/daily_update.py
