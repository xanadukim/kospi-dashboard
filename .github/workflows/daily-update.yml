name: KOSPI Quant Terminal v4.0 - Full Pipeline
on:
  schedule:
    - cron: '0 9 * * 0'
    - cron: '0 7 * * 1-5'
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (picks, track, retrain, all)'
        required: false
        default: 'all'

jobs:
  weekly-picks:
    if: github.event.schedule == '0 9 * * 0' || contains(github.event.inputs.job, 'picks') || contains(github.event.inputs.job, 'all') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin pykrx pandas numpy scikit-learn
      - name: Run weekly 64 picks screening (8x8)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          python scripts/daily_update.py

  performance-track:
    if: github.event.schedule == '0 7 * * 1-5' || contains(github.event.inputs.job, 'track') || contains(github.event.inputs.job, 'all') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin pykrx pandas numpy
      - name: Track performance - actual returns
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          python scripts/track_performance.py

  model-retrain:
    if: github.event.schedule == '0 2 1 * *' || contains(github.event.inputs.job, 'retrain') || contains(github.event.inputs.job, 'all') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin pandas numpy scikit-learn
      - name: Retrain models - 6 months performance based
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          python scripts/retrain_model.py
