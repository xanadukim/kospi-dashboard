name: KOSPI Quant Terminal v60 - Daily Update + QC Gate 100% REAL

on:
  schedule:
    - cron: '30 22 * * 0-4'  # UTC 22:30 = KST 07:30 평일 아침 (미국 장 마감 후)
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps v60 China Proxy
        run: |
          pip install firebase-admin yfinance requests lxml pandas numpy pykrx beautifulsoup4

      - name: Data Quality Check Gate - v60 10 Factors + China Proxy + 0.85 Fallback Detection
        id: qc_gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          echo "=== QC Gate v60 - 10 Factors NaN 체크 - 실패 시 전체 중단 ==="
          python scripts/data_quality_check_v60.py
          echo "QC Gate passed - proceeding to daily update"

      - name: Run daily update - v60 REAL 10 Factors + 64 Picks + DART
        if: steps.qc_gate.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRICE_SOURCE: yfinance
        run: |
          echo "=== Daily Update v60 China Proxy 100% REAL ==="
          python scripts/daily_update.py

      - name: Summary
        if: always()
        run: |
          echo "v60 Daily pipeline with QC Gate completed"
          echo "- QC: data_quality_logs/{today} - NaN/0.85 fallback 체크"
          echo "- Factors: factor_snapshots/{today} - 10 Factors REAL"
          echo "QC가 FAIL이면 daily_update는 실행 안 됨 (안전 장치)"
