name: KOSPI Quant Terminal v61.6-stable - Daily Update + QC Gate + Regime + Retrain REAL_ONLY

on:
  schedule:
    - cron: '30 22 * * 0-4'  # UTC 22:30 = KST 07:30 평일 아침
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps v61.6 REAL_ONLY
        run: |
          pip install firebase-admin yfinance requests lxml pandas numpy pykrx beautifulsoup4

      - name: Refresh foreigner supply CSV - pykrx KRX
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          echo "=== Refresh foreigner_kospi200.csv via pykrx ==="
          python scripts/update_foreigner_csv.py

      - name: Data Quality Check Gate - v61.6 REAL_ONLY
        id: qc_gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          echo "=== QC Gate v61.6-stable REAL_ONLY ==="
          python scripts/data_quality_check_v60.py
          echo "QC Gate passed"

      - name: Run daily update - v61.6 REAL_ONLY 10 Factors + 64 Picks + DART + Regime + Retrain
        if: steps.qc_gate.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRICE_SOURCE: yfinance
        run: |
          echo "=== Daily Update v61.6-stable REAL_ONLY ==="
          echo "- Price Source: yfinance (KRX OPEN API optional; disabled until endpoint verified)"
          echo "- Factors: SP500/US10Y/SOX/원달러/WTI/DXY/VIX/구리/상해종합 + 외국인 CSV"
          echo "- Regime Detector: VIX/OVX/DXY/WTI/KOSPI REAL"
          echo "- Meta Tracker: disabled; use meta_factor_tracker_v60.py output"
          echo "- Retrain: beta_snapshots/latest fetch"
          python scripts/daily_update.py

      - name: Summary
        if: always()
        run: |
          echo "v61.6-stable Daily pipeline REAL_ONLY with QC Gate + Regime + Retrain completed"
          echo "- QC: data_quality_logs/{today}"
          echo "- Factors: factor_snapshots/{today} - 10 Factors REAL + regime + retrain"
          echo "- Regime: regime_history/{today} - VIX/OVX/DXY REAL + 8 indicators"
          echo "- Meta: meta_summaries/{today} from performance workflow"
          echo "- Retrain: beta_snapshots/latest - 8 industries REAL"
          echo "QC FAIL이면 daily_update 실행 안 됨"

  notify:
    needs: [daily]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline alert notify
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.daily.result }}';
            const workflowName = '${{ github.workflow }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const title = '[ALERT] ' + workflowName;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pipeline-alert',
                color: 'd73a4a',
              });
            } catch (e) { /* label may already exist */ }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pipeline-alert',
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find(i => i.title === title);

            if (outcome === 'failure' || outcome === 'cancelled') {
              const body = 'Workflow **' + workflowName + '** ended with **' + outcome + '**.

Run: ' + runUrl + '

Auto-created by pipeline notify. Closes on next success.';
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Still ' + outcome + '. Latest run: ' + runUrl,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['pipeline-alert'],
                });
              }
            } else if (outcome === 'success' && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recovered. Run: ' + runUrl,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
