name: KOSPI Quant Terminal v60.2 - Daily Update + QC Gate + Regime + Retrain REAL

on:
  schedule:
    - cron: '30 22 * * 0-4'  # UTC 22:30 = KST 07:30 평일 아침
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps v60.2 Regime + Retrain
        run: |
          pip install firebase-admin yfinance requests lxml pandas numpy pykrx beautifulsoup4

      - name: Data Quality Check Gate - v60 10 Factors + China Proxy + 0.85 Fallback Detection
        id: qc_gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          echo "=== QC Gate v60 - 10 Factors NaN 체크 ==="
          python scripts/data_quality_check_v60.py
          echo "QC Gate passed"

      - name: Run daily update - v60.2 REAL 10 Factors + 64 Picks + DART + Regime + Retrain
        if: steps.qc_gate.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRICE_SOURCE: yfinance
        run: |
          echo "=== Daily Update v60.2 Regime + Retrain 6M REAL ==="
          echo "- Regime Detector: VIX/OVX/DXY/WTI/KOSPI REAL"
          echo "- Meta Tracker: P(valid|regime) + bonus"
          echo "- Retrain: beta_snapshots/latest fetch"
          python scripts/daily_update.py

      - name: Summary
        if: always()
        run: |
          echo "v60.2 Daily pipeline with QC Gate + Regime + Retrain completed"
          echo "- QC: data_quality_logs/{today}"
          echo "- Factors: factor_snapshots/{today} - 10 Factors REAL + regime + retrain"
          echo "- Regime: regime_history/{today} - VIX/OVX/DXY REAL + 8 indicators"
          echo "- Meta: meta_history/{today} - P(valid|regime) regime aware"
          echo "- Retrain: beta_snapshots/latest - 8 industries RidgeCV REAL"
          echo "QC FAIL이면 daily_update 실행 안 됨"
