name: KOSPI Quant Terminal v60.2 - Monthly Retrain + 6M Auto REAL

on:
  schedule:
    - cron: '0 2 1 * *'  # 매월 1일 02:00 UTC = 11:00 KST
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Retrain window days (default 180)'
        required: false
        default: '180'
        type: string
      force:
        description: 'Force retrain even if recently retrained'
        required: false
        default: false
        type: boolean

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps v60.2 Retrain REAL - FIX yfinance
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin yfinance requests lxml pandas numpy pykrx beautifulsoup4 scikit-learn --upgrade
          python -c "import yfinance; print(f'yfinance {yfinance.__version__} OK')"
          python -c "import firebase_admin; print('firebase-admin OK')"
          python -c "import sklearn; print(f'sklearn {sklearn.__version__} OK')"

      - name: Run retrain model - v60.2 RidgeCV REAL 180D
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRICE_SOURCE: yfinance
        run: |
          echo "=== Retrain v60.2 - 6개월 재학습 - RidgeCV REAL ==="
          echo "- Window: ${{ inputs.window_days || '180' }} days"
          echo "- Industries: 8 (elec, auto, chem, fin, bio, steel, const, retail)"
          echo "- Factors: 10 (SP500, US10Y, 외국인, SOX, 원달러, WTI, DXY, VIX, 구리, 상해종합)"
          echo "- Method: RidgeCV alpha=[0.1,0.5,1.0,2.0] + StandardScaler + 70% new 30% old"
          echo "- Proxy: 삼성전자 005930 등 8개 대표주 REAL yfinance"
          python scripts/retrain_model.py

      - name: Check generated data.js.new
        run: |
          if [ -f "js/data.js.new" ]; then
            echo "✅ data.js.new generated - REAL data"
            ls -lh js/data.js.new
            echo "--- R2 summary ---"
            if [ -f "js/data.js" ]; then
              echo "Old R2:"
              grep -o '"r2": [0-9.]*' js/data.js | head -8 || echo "old format"
              echo "New R2:"
              grep -o '"r2": [0-9.]*' js/data.js.new | head -8 || grep -o 'r2: [0-9.]*' js/data.js.new | head -8
            fi
            echo "--- Beta changes count ---"
            grep -c "diff" js/data.js.new || echo "check retrain logs"
          else
            echo "❌ data.js.new not found"
            echo "Checking retrain logs..."
            ls -lh retrain*.json || echo "no json"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "v60.2 Retrain pipeline completed - REAL yfinance"
          echo "- retrain_history/{today} - 180D RidgeCV REAL"
          echo "- beta_snapshots/{today} - 8 industries new betas REAL"
          echo "- beta_snapshots/latest - always latest - Frontend LIVE"
          echo "- retrain_logs/{today} - summary"
          echo "- js/data.js.new - auto generated for manual commit"
          echo "Next retrain: 30 days later (monthly)"
          echo "Manual: cp js/data.js.new js/data.js && git commit && git push"
          echo "FIX: Deleted old retrain-model-v60.yml which lacked yfinance"
