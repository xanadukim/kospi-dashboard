name: KOSPI Quant Terminal v61.6-stable - Monthly Retrain REAL_ONLY

on:
  schedule:
    - cron: '0 2 1 * *'  # 매월 1일 02:00 UTC = 11:00 KST
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Retrain window days (default 250 = 1Y)'
        required: false
        default: '250'
        type: string
      force:
        description: 'Force retrain even if recently retrained'
        required: false
        default: false
        type: boolean

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps v61.6 Retrain REAL_ONLY
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin yfinance requests lxml pandas numpy pykrx beautifulsoup4 scikit-learn --upgrade
          python -c "import yfinance; print(f'yfinance {yfinance.__version__} OK')"
          python -c "import firebase_admin; print('firebase-admin OK')"
          python -c "import sklearn; print(f'sklearn {sklearn.__version__} OK')"

      - name: Refresh foreigner supply CSV - pykrx KRX
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          echo "=== Refresh foreigner_kospi200.csv via pykrx ==="
          python scripts/update_foreigner_csv.py

      - name: Run retrain model - v61.6 REAL_ONLY 1Y-zspace
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRICE_SOURCE: yfinance
        run: |
          echo "=== Retrain v61.6-stable - REAL_ONLY - 1Y z-space ==="
          echo "- Window: ${{ inputs.window_days || '250' }} days"
          echo "- Industries: 8 (elec, auto, chem, fin, bio, steel, const, retail)"
          echo "- Factors: 10 (SP500, US10Y, 외국인, SOX, 원달러, WTI, DXY, VIX, 구리, 상해종합)"
          echo "- Method: Ridge alpha by holdout R2 + factor z features + OOS gate + 70% new / 30% base blending"
          echo "- Proxy: 삼성전자 005930 등 8개 대표주 yfinance .KS REAL"
          echo "- Price Source: yfinance (KRX OPEN API optional; disabled until endpoint verified)"
          python scripts/retrain_model.py

      - name: Check generated data.js.new
        run: |
          if [ -f "js/data.js.new" ]; then
            echo "✅ data.js.new generated - REAL data"
            ls -lh js/data.js.new
            echo "--- R2 summary ---"
            if [ -f "js/data.js" ]; then
              echo "Old R2:"
              grep -o '"r2": [0-9.]*' js/data.js | head -8 || echo "old format"
              echo "New R2:"
              grep -o '"r2": [0-9.]*' js/data.js.new | head -8 || grep -o 'r2: [0-9.]*' js/data.js.new | head -8
            fi
            echo "--- Beta changes count ---"
            grep -c "diff" js/data.js.new || echo "check retrain logs"
          else
            echo "❌ data.js.new not found"
            echo "Checking retrain logs..."
            ls -lh retrain*.json || echo "no json"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "v61.6-stable Retrain pipeline REAL_ONLY completed"
          echo "- retrain_history/{today} - 1Y z-space Ridge REAL"
          echo "- beta_snapshots/{today} - 8 industries new betas REAL"
          echo "- beta_snapshots/latest - always latest - Frontend LIVE"
          echo "- retrain_logs/{today} - summary"
          echo "- js/data.js.new - auto generated for manual commit"
          echo "Next retrain: 30 days later (monthly)"
          echo "Manual: cp js/data.js.new js/data.js && git commit && git push"

  notify:
    needs: [retrain]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline alert notify
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.retrain.result }}';
            const workflowName = '${{ github.workflow }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const title = '[ALERT] ' + workflowName;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pipeline-alert',
                color: 'd73a4a',
              });
            } catch (e) { /* label may already exist */ }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pipeline-alert',
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find(i => i.title === title);

            if (outcome === 'failure' || outcome === 'cancelled') {
              const body = 'Workflow **' + workflowName + '** ended with **' + outcome + '**. Run: ' + runUrl + ' - auto-created by pipeline notify; closes on next success.';
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Still ' + outcome + '. Latest run: ' + runUrl,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['pipeline-alert'],
                });
              }
            } else if (outcome === 'success' && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recovered. Run: ' + runUrl,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
