name: KOSPI Quant Terminal v60 - Monthly Retrain 10 Factors China Proxy
on:
  schedule:
    - cron: '0 2 1 * *'  # UTC 02:00 매월 1일 = KST 11:00
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install firebase-admin numpy pandas scikit-learn
      - name: Run retrain model - v60 China Proxy 10 Factors
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/retrain_model.py
