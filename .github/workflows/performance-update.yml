name: KOSPI Quant Terminal v61.6-stable - Performance + Regime + Meta REAL_ONLY

on:
  schedule:
    - cron: '0 7 * * 1-5'  # UTC 07:00 = KST 16:00 평일 (장 마감 후)
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps v61.6 REAL_ONLY
        run: |
          pip install firebase-admin yfinance requests lxml pandas numpy scikit-learn pykrx beautifulsoup4

      - name: Run regime detector - v61.6 REAL_ONLY yfinance
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "=== Regime Detector v61.6-stable REAL_ONLY ==="
          python scripts/regime_detector_v60.py

      - name: Run performance tracking - v61.6 REAL_ONLY yfinance
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          PRICE_SOURCE: yfinance
        run: |
          echo "=== Performance Tracking v61.6-stable REAL_ONLY ==="
          python scripts/track_performance_v60.py

      - name: Run meta factor tracker - v61.6 REAL_ONLY IC
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "=== Meta Factor Tracker v61.6-stable REAL_ONLY ==="
          python scripts/meta_factor_tracker_v60.py

      - name: Summary
        run: |
          echo "v61.6-stable Performance pipeline REAL_ONLY completed"
          echo "- regime_snapshots/{today} - VIX/OVX/DXY/TNX/KRW/KOSPI/SP500 + 구리(HG=F) + 상해종합(000001.SS)"
          echo "- performance_tracking/{recDate}_{ticker}_{evalDate} - 64 Picks REAL return vs KOSPI"
          echo "- factor_validity/{factor}_{today} - IC/HitRate for 10 Factors including 구리/상해종합"

  notify:
    needs: [performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline alert notify
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.performance.result }}';
            const workflowName = '${{ github.workflow }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const title = '[ALERT] ' + workflowName;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pipeline-alert',
                color: 'd73a4a',
              });
            } catch (e) { /* label may already exist */ }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pipeline-alert',
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find(i => i.title === title);

            if (outcome === 'failure' || outcome === 'cancelled') {
              const body = 'Workflow **' + workflowName + '** ended with **' + outcome + '**.

Run: ' + runUrl + '

Auto-created by pipeline notify. Closes on next success.';
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Still ' + outcome + '. Latest run: ' + runUrl,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['pipeline-alert'],
                });
              }
            } else if (outcome === 'success' && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recovered. Run: ' + runUrl,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
