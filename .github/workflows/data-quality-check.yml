name: KOSPI Quant Terminal v60 - Data Quality Gate Only

on:
  schedule:
    - cron: '20 22 * * 0-4'  # UTC 22:20 = KST 07:20 - daily-update 10분 전에 먼저 체크
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install firebase-admin yfinance requests lxml pandas numpy pykrx beautifulsoup4

      - name: Run Data Quality Check v60
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          echo "=== Data Quality Check v60 China Proxy ==="
          echo "10 Factors 중 NaN 1개면 FAIL -> GitHub Actions 빨간불 + 이메일 알림"
          echo "외국인 0.85 fallback 탐지 -> WARN"
          python scripts/data_quality_check_v60.py

      - name: Upload QC Log
        if: always()
        run: |
          echo "QC completed - check data_quality_logs collection in Firebase"

  notify:
    needs: [quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline alert notify
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.quality.result }}';
            const workflowName = '${{ github.workflow }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const title = '[ALERT] ' + workflowName;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pipeline-alert',
                color: 'd73a4a',
              });
            } catch (e) { /* label may already exist */ }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pipeline-alert',
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find(i => i.title === title);

            if (outcome === 'failure' || outcome === 'cancelled') {
              const body = 'Workflow **' + workflowName + '** ended with **' + outcome + '**. Run: ' + runUrl + ' - auto-created by pipeline notify; closes on next success.';
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Still ' + outcome + '. Latest run: ' + runUrl,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['pipeline-alert'],
                });
              }
            } else if (outcome === 'success' && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recovered. Run: ' + runUrl,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
